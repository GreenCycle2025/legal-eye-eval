name: benchmark-v3-validation

on:
  pull_request:
  push:
    branches:
      - feat/benchmark-v3-independent-doctrines

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify deterministic independent-doctrine suite
        run: |
          python3 benchmark_v3.py --check benchmarks/benchmark_v3_independent_100.json
          cp benchmarks/benchmark_v3_independent_100.json /tmp/benchmark_v3_independent_100.json
          python3 benchmark_v3.py --out benchmarks/benchmark_v3_independent_100.json
          cmp /tmp/benchmark_v3_independent_100.json benchmarks/benchmark_v3_independent_100.json
      - name: Run benchmark harness tests
        run: |
          python3 -m unittest -v test_benchmark_v2.py
          python3 -m unittest -v test_benchmark_v3.py
      - name: Compile harness
        run: |
          python3 -m py_compile \
            benchmark_v2.py benchmark_v2_report.py \
            benchmark_v3.py benchmark_v3_report.py \
            eval_graph_arguments.py \
            test_benchmark_v2.py test_benchmark_v3.py
