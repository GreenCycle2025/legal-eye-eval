name: Canonical Authority v2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile authority_expectations_v2.py eval_graph_arguments.py
      - run: pytest -q test_authority_expectations_v2.py
