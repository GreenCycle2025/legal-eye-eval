name: weekly-eval

# Runs the Legal Eye eval harness against the live production API every
# Sunday at 03:00 UTC and commits the fresh results and the README's
# generated blocks (render_readme.py). Manual triggers via the Actions tab
# are also allowed.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run eval against production
        id: eval
        run: |
          DATE=$(date -u +%Y_%m_%d)
          OUT="runs/run_${DATE}.json"
          # The public address the site calls, paced to its limit of 0.5
          # questions/s per client; wait for a sleeping server to start, and
          # ask a question once more only when it got no answer at all.
          python3 eval_graph_arguments.py \
            --base-url https://legal-eye-api.1bigfam.com \
            --via lawyer \
            --timeout 90 \
            --pace 2.5 \
            --retries 1 \
            --wait-ready 300 \
            --json "$OUT" || true
          python3 eval_rescore.py "$OUT" > /tmp/summary.txt
          cat /tmp/summary.txt
          python3 build_latest.py "$OUT" --out runs/latest.json
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Update README from the fresh run
        run: |
          python3 render_readme.py
          python3 -m unittest discover -s tests -v

      - name: Commit results
        run: |
          git config user.name "legal-eye-eval-bot"
          git config user.email "bot@legal-eye.1bigfam.com"
          git add runs/ README.md
          if git diff --cached --quiet; then
            echo "No changes — eval result identical to previous"
            exit 0
          fi
          git commit -m "auto: weekly eval run ${{ steps.eval.outputs.date }}"
          git push
